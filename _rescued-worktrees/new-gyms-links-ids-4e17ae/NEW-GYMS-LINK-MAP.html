*{margin:0;padding:0;box-sizing:border-box}
:root{--frame:#211a2b;--page:#faf6f0;--ink:#2a2030;--soft:#6a5f70;--line:#e7ded4;--tint:#f1eae1;

html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);background:var(--frame);

.app{height:calc(100vh - 32px);max-width:1820px;margin:0 auto;background:var(--page);border-radius:20px;

.search{flex:1;position:relative;max-width:660px}
.search input{width:100%;padding:10px 14px 10px 34px;border:1px solid var(--line);border-radius:10px;background:#fff;

.search input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(176,70,106,.13)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:13px}
.topcount{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--soft);white-space:nowrap}
.topcount b{color:var(--rose);font-size:15px}
.bulk{display:flex;gap:7px}
.btn{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;

.side{border-right:1px solid var(--line);background:linear-gradient(180deg,#f6efe6,#f2ebe1);padding:14px 12px;overflow-y:auto}

.slabel{font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--plum);margin:14px 6px 7px}

.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;

.nav button:hover{background:rgba(255,255,255,.75);color:var(--ink)}
.nav button.on{background:var(--plum);color:#fff;box-shadow:0 6px 16px rgba(70,41,92,.3)}
.nav button .n{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.75;font-weight:600}
.nav button.on .n{opacity:.95}
.gymrow{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.main{overflow:hidden;display:flex;flex-direction:column;background:var(--page)}

function filtered(){
 let r=DATA;
 if(gSel!=='ALL') r=r.filter(d=>d.g===gSel);
 if(cSel!=='OVERVIEW'&&cSel!=='ALL') r=r.filter(d=>d.cat===cSel);
 if(q){const t=q.toLowerCase();r=r.filter(d=>(d.name+' '+d.detail+' '+d.url+' '+d.id+' '+d.type+' '+d.cat+' '+d.g+' '+d.price).toLowerCase().includes(t));}
 return r;
}
function buildNav(){
 const ng=$('#navGym');
 ng.innerHTML=['ALL'].concat(CODES).map(function(c){
  const n=c==='ALL'?DATA.length:DATA.filter(d=>d.g===c).length;
  const label=c==='ALL'?'All 4 gyms':c+' · '+GYM[c].shortName;
  return '<button data-g="'+c+'"><span class="gymrow"><span class="dot" style="background:'+(c==='ALL'?'#6a5f70':HUE[c])+'"></span>'+esc(label)+'</span><span class="n">'+n+'</span></button>';
 }).join('');
 const nc=$('#navCat');
 const base=gSel==='ALL'?DATA:DATA.filter(d=>d.g===gSel);
 nc.innerHTML=['OVERVIEW','ALL'].concat(CATS).map(function(c){
  const n=c==='OVERVIEW'?'':(c==='ALL'?base.length:base.filter(d=>d.cat===c).length);
  const label=c==='OVERVIEW'?'⊞ Overview':(c==='ALL'?'Everything':c);
  return '<button data-c="'+c+'">'+esc(label)+'<span class="n">'+n+'</span></button>';
 }).join('');
 Array.from(ng.children).forEach(b=>{b.classList.toggle('on',b.dataset.g===gSel);b.onclick=()=>{gSel=b.dataset.g;render();};});
 Array.from(nc.children).forEach(b=>{b.classList.toggle('on',b.dataset.c===cSel);b.onclick=()=>{cSel=b.dataset.c;render();};});
}
function overview(){
 const gy=gSel==='ALL'?CODES:[gSel];
 function card(c){
  const G=GYM[c],k=G.counts;
  function m(l,v,extra){return '<div class="mrow"><span>'+l+'</span><b class="'+(v?'':'zero')+'">'+v+(extra||'')+'</b></div>';}
  return '<div class="gcard"><div class="hd" style="background:'+HUE[c]+'"><div class="c">'+c+'</div><div class="n">'+esc(G.name)+'</div><div class="a">'+esc(G.addr)+'<br>'+esc(G.phone)+' · locationId <b>'+G.locId+'</b></div></div><div class="bd">'
   +m('Classes',k.classes)+m('Class programs',k.classPrograms)+m('Levels',k.levels)
   +m('Camp types (booking tiles)',k.campTypes)
   +m('Camps bookable',k.camps,k.campsTotalApi!==k.camps?' <span style="font-size:10px;color:#b0466a">/'+k.campsTotalApi+'</span>':'')
   +m('Camp programs',k.campPrograms)+m('Appointment services',k.services)+m('Appointments listed',k.appointments)
   +m('Sessions',k.sessions)+m('ProShop products',k.products)
   +(G.tuitionRange?'<div class="mrow" style="border-top:1px solid #e7ded4;margin-top:5px;padding-top:7px"><span>Class tuition</span><b style="color:#0f7a6e">$'+G.tuitionRange.min.toFixed(0)+'&ndash;$'+G.tuitionRange.max.toFixed(0)+'</b></div><div style="font-size:10px;color:#8d8391;text-align:right;margin-top:-2px">'+(G.tuitionRange.n===k.classes?'all '+k.classes+' classes priced':G.tuitionRange.n+' of '+k.classes+' priced &middot; '+(k.classes-G.tuitionRange.n)+' at $0')+'<br>'+esc(G.termMix.map(function(t){return t.term;}).join(' / '))+'</div>':'')
   +'</div></div>';
 }
 function row(l,f){return '<tr><td>'+l+'</td>'+gy.map(c=>'<td>'+f(GYM[c],c)+'</td>').join('')+'</tr>';}
 const YN=b=>b?'<span class="yes">YES</span>':'<span class="no">no</span>';
 const G1='<span class="k">{slug}</span>', L1='<span class="k">{locId}</span>';
 const grammar=[
 '<span class="c">// PORTAL — what a customer sees</span>',
 'portal.iclasspro.com/'+G1+'/booking                <span class="c">landing tiles</span>',
 'portal.iclasspro.com/'+G1+'/classes                <span class="c">+ ?programs={id}  ?levels={id}  ?ages={n}</span>',
 'portal.iclasspro.com/'+G1+'/class-details/<span class="k">{classId}</span>',
 'portal.iclasspro.com/'+G1+'/camps/<span class="k">{typeId}</span>          <span class="c">typeId = camp TYPE, not program</span>',
 'portal.iclasspro.com/'+G1+'/camp-details/<span class="k">{campId}</span>',
 'portal.iclasspro.com/'+G1+'/appointments/<span class="k">{serviceId}</span>',
 'portal.iclasspro.com/'+G1+'/party-booking-01-date',
 'portal.iclasspro.com/'+G1+'/products  /gift-certificate  /news  /account  /dashboard  /cart  /login?showLogin=1',
 '',
 '<span class="c">// OPEN API — no login, returns JSON, works in a browser tab</span>',
 'app.iclasspro.com/api/open/v1/'+G1+'/locations  /sessions  /categories  /services',
 'app.iclasspro.com/api/open/v1/'+G1+'/class-programs/'+L1+'   /camp-programs/'+L1+'   /levels/active/'+L1,
 'app.iclasspro.com/api/open/v1/'+G1+'/classes?locationId='+L1+'&amp;limit=200&amp;page=1',
 'app.iclasspro.com/api/open/v1/'+G1+'/classes/<span class="k">{classId}</span>?locationId='+L1+'   <span class="c">← this one has TUITION</span>',
 'app.iclasspro.com/api/open/v1/'+G1+'/camps?locationId='+L1+'&amp;typeId=<span class="k">{T}</span>&amp;limit=100&amp;page=1',
 'app.iclasspro.com/api/open/v1/'+G1+'/appointments?locationId='+L1+'   /appointment-programs/'+L1+'   /products/'+L1
 ].join('\n');
 return '<div class="ov"><div class="ovgrid">'+gy.map(card).join('')+'</div>'
 +'<div class="ovh">Where the 4 setups actually differ</div><div class="diff"><table><thead><tr><th>Setting</th>'+gy.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'
 +row('iClass slug',G=>'<code class="sl">'+G.slug+'</code>')
 +row('locationId',G=>'<b style="font-family:JetBrains Mono,monospace">'+G.locId+'</b>')
 +row('&quot;Find a Class&quot; goes to',G=>G.findClass.indexOf('wizard')>-1?'<span style="color:#c0392b;font-weight:700">age wizard first</span>':'straight to /classes')
 +row('Tuition billed as',G=>G.termMix?G.termMix.map(function(t){return t.term+' <span style="color:#8d8391;font-size:11px">×'+t.n+'</span>';}).join('<br>'):'—')
 +row('Booking tiles on landing',G=>G.tiles.length)
 +row('ProShop in nav',G=>YN(G.proshop))
 +row('Gift certificates in nav',G=>YN(G.gift))
 +row('Uses appointments',G=>YN(G.counts.appointments>0))
 +row('Camp types live',G=>G.counts.campTypes)
 +'</tbody></table></div>'
 +'<div class="ovh">The URL grammar &mdash; every pattern verified live on these 4</div><div class="grammar">'+grammar+'</div>'
 +'<div class="warn" style="border-left-color:#0f7a6e;background:#eaf4f0;color:#255c50"><b>Class tuition IS in here &mdash; camp price is not.</b> All 559 classes across the 4 gyms carry a real tuition figure, pulled one class at a time from <code class="sl" style="color:#255c50">classes/{classId}?locationId={locId}</code> (no login). The camp detail endpoint has no price field at all &mdash; checked on AAR and PGN camps; camp prices still need an admin-authenticated pull.</div>'
 +'<div class="warn"><b>Two gaps to know about.</b> &nbsp;<b>1. Six PGN camps.</b> PGN\'s camp endpoint counts 64 camps but hands back 58; the other 6 exist and are not publicly bookable right now (closed registration windows). Cards above show that as <span style="color:#b0466a">bookable/total</span>. No other gym has a gap. &nbsp;<b>2. Camp types with zero live camps are invisible.</b> A camp type only shows up in this map if it has at least one camp the public API will return &mdash; so a type sitting empty today is not listed. Everything listed is real; the list is not proof there is nothing else.</div>'
 +'<div class="warn" style="border-left-color:#0f7a6e;background:#eaf4f0;color:#255c50"><b>Camp TYPE is not camp PROGRAM.</b> The booking tile and the <code class="sl" style="color:#255c50">/camps/{typeId}</code> URL use the camp <b>type</b> id &mdash; small numbers, 3 to 8. The <code class="sl" style="color:#255c50">programId</code> stamped on each camp is a different internal number (52, 62, 77, 294, 319). Both are in this map, labelled separately. Mixing them is the fastest way to build a dead link here.</div>'
 +'</div>';
}
function render(){
 buildNav();
 const p=$('#pane');
 if(cSel==='OVERVIEW'&&!q){
  $('#crumbT').textContent=gSel==='ALL'?'Overview — all 4 gyms':'Overview — '+gSel;
  $('#crumbS').textContent='counts are live as pulled';
  $('#cnt').textContent=(gSel==='ALL'?DATA.length:DATA.filter(d=>d.g===gSel).length);
  p.innerHTML=overview();p.scrollTop=0;return;}
 const r=filtered();
 $('#cnt').textContent=r.length;
 $('#crumbT').textContent=(gSel==='ALL'?'All 4 gyms':gSel+' · '+GYM[gSel].name)+' — '+(cSel==='OVERVIEW'?'search':cSel==='ALL'?'everything':cSel);
 $('#crumbS').textContent=q?'filtered by “'+q+'” · click any row for the full record':'click any row for the full record';
 if(!r.length){p.innerHTML='<div class="empty"><div class="b">Nothing matches that.</div>Try a plainer word — a gym code, an id number, or part of a class name.</div>';return;}
 p.innerHTML='<table><thead><tr><th>Gym</th><th>Category</th><th>Type</th><th>ID</th><th>Name</th><th>Price</th><th>Detail</th><th>Link</th></tr></thead><tbody>'
 +r.map(function(d){return '<tr data-i="'+DATA.indexOf(d)+'"><td class="g"><span class="dot" style="display:inline-block;background:'+HUE[d.g]+'"></span> '+d.g+'</td><td><span class="pill">'+esc(d.cat)+'</span></td><td>'+esc(d.type)+'</td><td class="id">'+esc(d.id)+'</td><td class="nm">'+esc(d.name)+'</td><td class="pr">'+(d.price?esc(d.price):'<span style="color:#cfc7d2">&mdash;</span>')+'</td><td class="dt">'+esc(d.detail)+'</td><td class="u">'+(d.url?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.url.replace(/^https?:\/\//,''))+'</a>':'<span style="color:#b9b0bd">&mdash;</span>')+'</td></tr>';}).join('')
 +'</tbody></table>';
 p.scrollTop=0;
 Array.from(p.querySelectorAll('tbody tr')).forEach(function(tr){tr.onclick=function(e){if(e.target.tagName==='A')return;openDrawer(DATA[+tr.dataset.i]);};});
}
function openDrawer(d){
 $('#dT').textContent=d.name||'(unnamed)';
 $('#dM').innerHTML='<span class="pill" style="background:'+HUE[d.g]+';color:#fff;border-color:'+HUE[d.g]+'">'+d.g+'</span><span class="pill">'+esc(d.cat)+'</span><span class="pill">'+esc(d.type)+'</span>'+(d.id?'<span class="pill">id '+esc(d.id)+'</span>':'');
 function f(l,v,mono){return v?'<div class="f"><div class="l">'+l+'</div><div class="v'+(mono?' mono':'')+'">'+v+'</div></div>':'';}
 let h='';
 h+=f('Gym',esc(GYM[d.g].name)+' &nbsp;·&nbsp; slug <code class="sl">'+d.slug+'</code> &nbsp;·&nbsp; locationId '+GYM[d.g].locId);
 h+=f('ID',esc(d.id),1);
 if(d.price)h+=f('Price',' <span style="font-family:JetBrains Mono,monospace;font-size:19px;font-weight:800;color:#0f7a6e">'+esc(d.price)+'</span>');
 h+=f('Details',esc(d.detail));
 h+=f('URL',d.url?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.url)+'</a>':'');
 if(d.url){h+='<div class="dacts"><button class="btn" data-cp="'+esc(d.url)+'">Copy link</button><a class="btn" style="text-decoration:none;display:inline-block" href="'+esc(d.url)+'" target="_blank" rel="noopener">Open</a></div>';}
 const rel=DATA.filter(function(x){
  if(x.g!==d.g||x===d)return false;
  if(d.cat==='CAMP TYPE'&&x.cat==='CAMP')return (x.detail||'').indexOf('typeId '+d.id+' ')===0;
  if(d.cat==='CLASS PROGRAM'&&x.cat==='CLASS')return (x.detail||'').indexOf('programId '+d.id+' ')===0;
  if(d.cat==='CAMP PROGRAM'&&x.cat==='CAMP')return (x.detail||'').indexOf('programId '+d.id+' ')>-1;
  if(d.cat==='LEVEL'&&x.cat==='CLASS')return (x.detail||'').indexOf('levelId '+d.id+' ')>-1;
  if(d.cat==='APPOINTMENT'&&d.type.indexOf('service')>-1&&x.cat==='APPOINTMENT')return (x.detail||'').indexOf('serviceId '+d.id+' ')===0;
  return false;
 }).slice(0,60);
 if(rel.length){h+='<div class="f"><div class="l">Linked to this ('+rel.length+')</div><div class="v">'+rel.map(function(x){return '<div style="padding:5px 0;border-bottom:1px dotted #e7ded4"><span class="pill">'+esc(x.cat)+'</span> '+esc(x.name)+(x.url?' &nbsp;<a href="'+esc(x.url)+'" target="_blank" rel="noopener" style="font-family:JetBrains Mono,monospace;font-size:10px">open</a>':'')+'</div>';}).join('')+'</div></div>';}
 $('#dB').innerHTML=h;
 Array.from($('#dB').querySelectorAll('[data-cp]')).forEach(function(b){b.onclick=function(){cp(b,b.dataset.cp);};});
 $('#drawer').classList.add('on');$('#scrim').classList.add('on');
}
function cp(btn,t){navigator.clipboard.writeText(t).then(function(){const o=btn.textContent;btn.textContent='Copied ✓';btn.classList.add('ok');setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');},1300);});}
function closeD(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');}
$('#dx').onclick=closeD;$('#scrim').onclick=closeD;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeD();if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}});
$('#q').oninput=function(e){q=e.target.value.trim();render();};
function currentRows(){return (cSel==='OVERVIEW'&&!q)?DATA.filter(d=>gSel==='ALL'||d.g===gSel):filtered();}
$('#cpUrls').onclick=function(){cp(this,currentRows().map(d=>d.url).filter(Boolean).join('\n'));};
$('#cpCsv').onclick=function(){
 const r=currentRows();
 function qq(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
 cp(this,['gym,category,type,id,name,price,detail,url'].concat(r.map(d=>[d.g,d.cat,d.type,d.id,d.name,d.price,d.detail,d.url].map(qq).join(','))).join('\n'));};
render();
</script></body></html>
